<!DOCTYPE html>
<!--
  The page of the Kazo Spreadsheets iframe (doc/en/plan.md, decision 3). GridCraft runs here, in
  page host mode (data-host="page"). craft-proxy.js, served by Kazo OS with the Kazo.Os.AppSdk.Craft
  module (ADR 0259), reads data-craft-app and data-craft-build, starts GridCraft from
  ../gridcraft/gridcraft.json and relays its canvas events to the window through the MessagePort
  the window hands over. GridCraft writes a start error into gridcraft_loading. No inline script
  or style.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Kazo Spreadsheets</title>
  <link rel="stylesheet" href="../../Kazo.Os.AppSdk.Craft/craft-page.css">
  <script type="module" src="../../Kazo.Os.AppSdk.Craft/craft-proxy.js"></script>
</head>
<body>
  <canvas id="gridcraft_canvas" data-host="page"
          data-craft-app="gridcraft" data-craft-build="../gridcraft/gridcraft.json"></canvas>
  <div id="gridcraft_loading" data-craft-loading aria-hidden="true"></div>
</body>
</html>
