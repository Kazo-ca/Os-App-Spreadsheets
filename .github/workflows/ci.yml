# Builds and tests the Release profile: the Kazo OS packages from nuget.org, at the version of the
# submodule (ADR 0176 §4, §6). This is what the Kazo OS Store compiles.
#
# Until the Kazo OS release that contains the Kazo.Os.AppSdk.Craft module (doc/en/plan.md,
# decision 2), the submodule sits on craft-host/base and the Release build takes the Kazo OS
# projects from it (KazoOsUseSource=true): the module is not on nuget.org yet. Work item 4 puts
# the submodule on the release tag and removes KAZOOS_BRANCH and KAZOOS_USE_SOURCE.
#
# The Build GridCraft workflow also calls it on the branch it pushes, since a push made with the
# workflow token starts no workflow.
name: CI

on:
  push:
    branches: [main, "spreadsheets/base"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Branch to check out and test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: "ci-${{ inputs.ref || github.ref }}"
  cancel-in-progress: true

env:
  KAZOOS_BRANCH: craft-host/base
  KAZOOS_USE_SOURCE: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      # Only the Kazo OS submodule. external/gridcraft (GridCraft's sources) is only needed to
      # compile GridCraft (build-gridcraft.yml); the app uses the build in wwwroot/gridcraft/.
      - name: Fetch the Kazo OS submodule
        run: git submodule update --init --depth 1 external/KazoOs

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check the Kazo OS submodule
        run: bash .github/scripts/check-kazoos-submodule.sh

      - name: Build (Release)
        run: dotnet build -c Release -p:KazoOsUseSource=$KAZOOS_USE_SOURCE

      - name: Test
        run: dotnet test -c Release --no-build -p:KazoOsUseSource=$KAZOOS_USE_SOURCE
