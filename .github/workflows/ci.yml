# CI of the app: builds and tests the Release profile, the Kazo OS packages from nuget.org at the
# version of the submodule (ADR 0176 §4, §6). This is what the Kazo OS Store compiles.
# The steps live in the reusable workflow kazoos-ci.yml of Kazo-ca/Os-AppTemplate (ADR 0271 §7):
# it fetches only the Kazo OS submodule (external/gridcraft is needed only to compile GridCraft,
# build-gridcraft.yml), checks it and the README's Store listing, then builds and tests.
#
# The Build GridCraft workflow calls the same reusable workflow on the branch it pushes, since a
# push made with the workflow token starts no workflow.
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: Kazo-ca/Os-AppTemplate/.github/workflows/kazoos-ci.yml@v1
